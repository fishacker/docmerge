[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fishacker-docmerge"
version = "0.1.0"
description = "统计各来源片段的贡献量与占比，标出文档去重与版本归并上最主要的来源"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "fishacker" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://fishacker.github.io"
Repository = "https://github.com/fishacker/docmerge"
Issues = "https://github.com/fishacker/docmerge/issues"

[project.scripts]
docmerge = "docmerge:main"

[tool.setuptools]
py-modules = ["docmerge"]
